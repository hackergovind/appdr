  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="3" stroke-dasharray="6,4" opacity="0.6"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="#235246" stroke-width="2" />
  
  <!-- Botanical Leaves forming a healing crest -->
