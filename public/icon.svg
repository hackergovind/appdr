  <text x="256" y="390" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#F4E8C1" text-anchor="middle" letter-spacing="4">DR. HARSHIKA</text>
  <text x="256" y="420" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#9CB8A7" text-anchor="middle" letter-spacing="5">WELLNESS &amp; HOMOEOPATHY</text>
